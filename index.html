<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nandini Clochard Vadla | Cybersecurity • Data Science • AI</title>
<meta name="description" content="Nandini Clochard Vadla, MSc Cybersecurity & Data Science student at ESAIP Angers. Projects in digital forensics, DevSecOps, cloud security, big data and machine learning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --charcoal:#0e0f12;
  --charcoal-2:#15171a;
  --maroon:#2a1212;
  --rose:#7a4a4a;
  --sage:#a1a876;
  --tan:#b89f72;
  --text:#efe9df;
  --muted:#aaa59b;
  --line:rgba(239,233,223,.1);
  --card:rgba(38,17,17,.45);
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}

*{box-sizing:border-box;margin:0;padding:0}

html{
  scroll-behavior:smooth;
  scroll-padding-top:84px
}

body{
  font-family:var(--body);
  color:var(--text);
  background:var(--charcoal);
  line-height:1.65;
  overflow-x:hidden
}

a{color:inherit;text-decoration:none}
img,svg{max-width:100%}

:focus-visible{
  outline:2px solid var(--sage);
  outline-offset:3px;
  border-radius:6px
}

.wrap{
  width:min(1120px,100% - 40px);
  margin-inline:auto
}

section{padding:96px 0}

.section-head{
  margin-bottom:8px;
}

.section-head .eyebrow{
  color:var(--tan);
  font-size:.78rem;
  font-weight:700;
  letter-spacing:.14em;
  margin-bottom:8px;
}

.section-head > p:last-child{
  color:var(--muted);
  max-width:60ch;
}

h1,h2,h3{
  font-family:var(--display);
  font-weight:600;
  line-height:1.15;
  letter-spacing:-.01em
}

h2{
  font-size:clamp(2rem,4vw,2.9rem);
  margin-bottom:12px
}

.lead{
  color:var(--muted);
  max-width:60ch;
  margin-bottom:44px
}

/* ---------- Header ---------- */

header{
  position:fixed;
  inset:0 0 auto 0;
  z-index:50;
  transition:background .3s,box-shadow .3s
}

header.solid{
  background:rgba(14,15,18,.82);
  backdrop-filter:blur(14px);
  box-shadow:0 1px 0 var(--line)
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:72px;
  gap:16px
}

.brand{
  font-family:var(--display);
  font-size:1.25rem;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px
}

.brand i{
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--sage);
  box-shadow:0 0 0 0 rgba(161,168,118,.6);
  animation:pulse 2.6s infinite
}

@keyframes pulse{
  70%{box-shadow:0 0 0 12px rgba(161,168,118,0)}
  100%{box-shadow:0 0 0 0 rgba(161,168,118,0)}
}

.links{
  display:flex;
  gap:26px;
  list-style:none;
  font-size:.95rem;
  font-weight:500
}

.links a{
  color:var(--muted);
  position:relative;
  padding:6px 0;
  transition:color .2s
}

.links a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  height:2px;
  width:100%;
  background:var(--tan);
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .3s var(--ease)
}

.links a:hover,
.links a.active{
  color:var(--text)
}

.links a:hover::after,
.links a.active::after{
  transform:scaleX(1)
}

.tools{
  display:flex;
  align-items:center;
  gap:12px
}

.lang{
  position:relative;
  display:flex;
  border:1px solid var(--line);
  border-radius:999px;
  padding:3px;
  background:rgba(0,0,0,.2)
}

.lang button{
  position:relative;
  z-index:3;
  border:0;
  background:none;
  color:var(--muted);
  font:600 .8rem var(--body);
  padding:6px 14px;
  border-radius:999px;
  cursor:pointer;
  transition:color .25s
}

.lang button[aria-pressed="true"]{
  color:var(--charcoal)
}

.lang .thumb{
  position:absolute;
  z-index:1;
  top:3px;
  left:3px;
  height:calc(100% - 6px);
  width:calc(50% - 3px);
  background:var(--sage);
  border-radius:999px;
  transition:transform .35s var(--ease)
}

.lang[data-lang="fr"] .thumb{
  transform:translateX(100%)
}

.burger{
  display:none;
  width:42px;
  height:42px;
  border-radius:12px;
  border:1px solid var(--line);
  background:none;
  color:var(--text);
  cursor:pointer
}

.burger span{
  display:block;
  width:18px;
  height:2px;
  background:currentColor;
  margin:4px auto;
  transition:transform .3s,opacity .3s
}

.burger[aria-expanded="true"] span:nth-child(1){
  transform:translateY(6px) rotate(45deg)
}

.burger[aria-expanded="true"] span:nth-child(2){
  opacity:0
}

.burger[aria-expanded="true"] span:nth-child(3){
  transform:translateY(-6px) rotate(-45deg)
}

/* ---------- Buttons ---------- */

.btn{
  position:relative;
  overflow:hidden;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  border:1px solid transparent;
  cursor:pointer;
  font:700 .95rem var(--body);
  padding:14px 26px;
  border-radius:14px;
  transition:transform .2s var(--ease),box-shadow .3s,background .3s,border-color .3s,color .3s;
  -webkit-tap-highlight-color:transparent
}

.btn svg{
  width:18px;
  height:18px;
  flex:none;
  transition:transform .3s var(--ease)
}

.btn:hover svg{
  transform:translateX(3px)
}

.btn:active{
  transform:scale(.96)
}

.btn.primary{
  background:linear-gradient(135deg,var(--sage),var(--tan));
  color:var(--charcoal);
  box-shadow:0 10px 30px -10px rgba(161,168,118,.6)
}

.btn.primary:hover{
  box-shadow:0 16px 36px -10px rgba(184,159,114,.75);
  transform:translateY(-2px)
}

/* Special animated effect for the main View my projects button */
#hero .btn.primary{
  animation:projectGlow 2.8s ease-in-out infinite;
}

#hero .btn.primary:hover{
  animation-play-state:paused;
}

@keyframes projectGlow{
  0%,100%{
    box-shadow:0 10px 30px -10px rgba(161,168,118,.55);
  }
  50%{
    box-shadow:0 14px 42px -8px rgba(184,159,114,.9),0 0 0 5px rgba(161,168,118,.08);
  }
}

.btn.primary::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);
  transform:translateX(-120%);
  transition:transform .7s var(--ease)
}

.btn.primary:hover::before{
  transform:translateX(120%)
}

.btn.ghost{
  background:rgba(239,233,223,.04);
  border-color:var(--line);
  color:var(--text)
}

.btn.ghost:hover{
  border-color:var(--tan);
  background:rgba(184,159,114,.1);
  transform:translateY(-2px)
}

/* Special effect for project buttons */
#hero .btn.primary{
  position:relative;
  overflow:hidden;
  isolation:isolate;
}

#hero .btn.primary::after{
  content:"";
  position:absolute;
  top:0;
  left:-130%;
  width:70%;
  height:100%;
  transform:skewX(-22deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);
  transition:left .75s ease;
  pointer-events:none;
  z-index:0;
}

#hero .btn.primary:hover::after{
  left:150%;
}

#hero .btn.primary > *{
  position:relative;
  z-index:1;
}

.btn.small{
  padding:10px 18px;
  font-size:.85rem;
  border-radius:12px
}

.ripple{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.4);
  transform:scale(0);
  animation:rip .6s ease-out forwards;
  pointer-events:none
}

@keyframes rip{
  to{
    transform:scale(4);
    opacity:0
  }
}

/* ---------- Hero ---------- */

#hero{
  min-height:100svh;
  display:flex;
  align-items:center;
  padding:120px 0 72px;
  position:relative
}

#net{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:-1;
  pointer-events:none
}

.aurora{
  position:fixed;
  inset:0;
  z-index:-2;
  overflow:hidden;
  pointer-events:none
}

.aurora i{
  position:absolute;
  border-radius:50%;
  filter:blur(100px);
  animation:drift 24s ease-in-out infinite alternate
}

.aurora i:nth-child(1){
  width:560px;
  height:560px;
  background:var(--rose);
  opacity:.3;
  top:-160px;
  right:-100px
}

.aurora i:nth-child(2){
  width:460px;
  height:460px;
  background:var(--sage);
  opacity:.12;
  bottom:-140px;
  left:4%;
  animation-duration:30s;
  animation-delay:-9s
}

.aurora i:nth-child(3){
  width:640px;
  height:640px;
  background:#3b1616;
  opacity:.55;
  top:38%;
  left:42%;
  animation-duration:36s;
  animation-delay:-16s
}

@keyframes drift{
  to{
    transform:translate3d(-110px,80px,0) scale(1.18)
  }
}

.hero-grid{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:56px;
  align-items:center
}

.hello{
  color:var(--tan);
  font-weight:600;
  margin-bottom:14px
}

h1{
  font-size:clamp(2.8rem,7vw,5.4rem);
  letter-spacing:-.025em;
  margin-bottom:18px
}

.role{
  font-family:var(--display);
  font-size:clamp(1.3rem,2.6vw,1.9rem);
  color:var(--sage);
  min-height:2.4em
}

.caret{
  display:inline-block;
  width:2px;
  height:1em;
  background:var(--tan);
  vertical-align:-.12em;
  margin-left:3px;
  animation:blink 1s steps(1) infinite
}

@keyframes blink{
  50%{opacity:0}
}

.hero p.sub{
  color:var(--muted);
  max-width:52ch;
  margin:10px 0 32px;
  font-size:1.05rem
}

.cta{
  display:flex;
  flex-wrap:wrap;
  gap:14px
}

.term{
  background:rgba(8,8,10,.88);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 30px 60px -25px rgba(0,0,0,.7),0 0 0 1px rgba(119,72,72,.25);
  overflow:hidden;
  transform:rotate(1.2deg);
  transition:transform .5s var(--ease)
}

.term:hover{
  transform:rotate(0)
}

.term-bar{
  display:flex;
  gap:7px;
  padding:13px 16px;
  border-bottom:1px solid var(--line);
  background:rgba(42,18,18,.7)
}

.term-bar i{
  width:11px;
  height:11px;
  border-radius:50%
}

.term-bar i:nth-child(1){background:var(--rose)}
.term-bar i:nth-child(2){background:var(--tan)}
.term-bar i:nth-child(3){background:var(--sage)}

.term-body{
  font:400 .82rem/1.9 var(--mono);
  padding:20px;
  min-height:230px;
  color:#cfc9be;
  white-space:pre-wrap;
  word-break:break-word
}

.term-body .ok{color:var(--sage)}
.term-body .warn{color:#d59a8f}
.term-body .cmd{color:var(--tan)}

.scroll-hint{
  position:absolute;
  bottom:26px;
  left:50%;
  translate:-50% 0;
  z-index:1;
  width:26px;
  height:42px;
  border:2px solid var(--line);
  border-radius:14px
}

.scroll-hint::after{
  content:"";
  position:absolute;
  left:50%;
  top:8px;
  width:4px;
  height:8px;
  border-radius:4px;
  background:var(--tan);
  translate:-50% 0;
  animation:wheel 1.8s infinite
}

@keyframes wheel{
  0%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(14px)}
}

/* ---------- About ---------- */

.about-grid{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:48px
}

.about-grid p{
  color:#d8d2c7;
  margin-bottom:16px;
  max-width:62ch
}

.facts{
  list-style:none;
  display:grid;
  gap:12px;
  margin-top:24px
}

.facts li{
  display:flex;
  gap:12px;
  align-items:center;
  color:var(--muted)
}

.facts svg{
  width:20px;
  height:20px;
  color:var(--tan);
  flex:none
}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:28px
}

.panel h3{
  font-size:1.25rem;
  margin-bottom:20px
}

.lg{
  margin-bottom:18px
}

.lg div{
  display:flex;
  justify-content:space-between;
  font-size:.92rem;
  margin-bottom:7px
}

.lg span:last-child{
  color:var(--tan);
  font-weight:600
}

.bar{
  height:8px;
  border-radius:8px;
  background:rgba(239,233,223,.09);
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  width:0;
  border-radius:8px;
  background:linear-gradient(90deg,var(--rose),var(--tan),var(--sage));
  transition:width 1.4s var(--ease)
}

/* ---------- Skills ---------- */

.skills{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px
}

.skill{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:24px;
  transition:border-color .3s,transform .3s var(--ease)
}

.skill:hover{
  border-color:rgba(161,168,118,.55);
  transform:translateY(-4px)
}

.skill h3{
  font-size:1.1rem;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:10px
}

.skill h3 svg{
  width:22px;
  height:22px;
  color:var(--sage)
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.chip{
  font-size:.8rem;
  font-weight:500;
  padding:5px 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(10,10,12,.7);
  color:#ddd6c9;
  transition:background .25s,color .25s,border-color .25s
}

.chip:hover{
  background:var(--sage);
  color:var(--charcoal);
  border-color:var(--sage)
}

/* ---------- Projects ---------- */

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:32px
}

.filters button{
  font:600 .88rem var(--body);
  padding:9px 20px;
  border-radius:999px;
  border:1px solid var(--line);
  background:none;
  color:var(--muted);
  cursor:pointer;
  transition:all .25s
}

.filters button:hover{
  color:var(--text);
  border-color:var(--tan)
}

.filters button[aria-pressed="true"]{
  background:var(--rose);
  border-color:var(--rose);
  color:#fff
}

.projects{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:22px
}

.proj{
  position:relative;
  display:flex;
  flex-direction:column;
  background:linear-gradient(160deg,rgba(42,18,18,.6),rgba(16,17,20,.85));
  border:1px solid var(--line);
  border-radius:20px;
  padding:26px;
  overflow:hidden;
  transition:transform .35s var(--ease),border-color .3s,box-shadow .35s
}

.proj::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  height:3px;
  width:100%;
  background:linear-gradient(90deg,var(--sage),var(--tan),var(--rose));
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .5s var(--ease)
}

.proj:hover{
  transform:translateY(-6px);
  border-color:rgba(184,159,114,.5);
  box-shadow:0 24px 50px -24px rgba(0,0,0,.8)
}

.proj:hover::before{
  transform:scaleX(1)
}

.proj.hide{
  display:none
}

.proj .type{
  font-size:.78rem;
  color:var(--tan);
  font-weight:600;
  margin-bottom:10px
}

.proj h3{
  font-size:1.3rem;
  margin-bottom:10px
}

.proj p{
  color:#cfc9be;
  font-size:.95rem;
  margin-bottom:18px;
  flex:1
}

.proj .chips{
  margin-bottom:18px
}

.metric{
  display:inline-block;
  font-family:var(--display);
  color:var(--sage);
  font-size:1.6rem;
  font-weight:700;
  margin-bottom:6px
}

/* ---------- Timeline ---------- */

.timeline{
  position:relative;
  padding-left:34px;
  display:grid;
  gap:28px
}

.timeline::before{
  content:"";
  position:absolute;
  left:7px;
  top:6px;
  bottom:6px;
  width:2px;
  background:linear-gradient(var(--sage),var(--rose))
}

.item{
  position:relative;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:24px 26px
}

.item::before{
  content:"";
  position:absolute;
  left:-34px;
  top:28px;
  width:16px;
  height:16px;
  border-radius:50%;
  background:var(--charcoal);
  border:3px solid var(--tan)
}

.item time{
  font-size:.85rem;
  color:var(--tan);
  font-weight:600
}

.item h3{
  font-size:1.25rem;
  margin:4px 0 2px
}

.item .where{
  color:var(--sage);
  font-size:.95rem;
  margin-bottom:10px
}

.item ul{
  list-style:none;
  color:#d3cdc2;
  display:grid;
  gap:6px;
  font-size:.95rem
}

.item li{
  padding-left:18px;
  position:relative
}

.item li::before{
  content:"";
  position:absolute;
  left:0;
  top:.7em;
  width:7px;
  height:2px;
  background:var(--tan)
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:56px
}

/* ---------- Contact ---------- */

.contact-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px
}

.cards{
  display:grid;
  gap:14px
}

.ccard{
  display:flex;
  align-items:center;
  gap:16px;
  padding:18px 20px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--card);
  transition:transform .3s var(--ease),border-color .3s,background .3s
}

.ccard:hover{
  transform:translateX(6px);
  border-color:var(--sage);
  background:rgba(161,168,118,.09)
}

.ccard .ic{
  width:46px;
  height:46px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--rose),var(--maroon));
  flex:none
}

.ccard .ic svg{
  width:22px;
  height:22px;
  color:var(--text)
}

.ccard small{
  display:block;
  color:var(--muted);
  font-size:.8rem
}

.ccard strong{
  font-weight:600;
  word-break:break-all
}

form{
  display:grid;
  gap:14px
}

label{
  font-size:.85rem;
  color:var(--muted);
  display:grid;
  gap:6px
}

input,textarea{
  font:500 1rem var(--body);
  color:var(--text);
  background:rgba(6,6,8,.6);
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px 15px;
  transition:border-color .25s,box-shadow .25s;
  width:100%
}

input:focus,textarea:focus{
  outline:none;
  border-color:var(--sage);
  box-shadow:0 0 0 4px rgba(161,168,118,.16)
}

textarea{
  min-height:130px;
  resize:vertical
}

footer{
  padding:36px 0;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:.9rem
}

footer .wrap{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px
}

/* ---------- Resume modal ---------- */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  place-items:center;
  background:rgba(10,10,12,.72);
  backdrop-filter:blur(6px);
  padding:20px
}

.modal.open{
  display:grid;
  animation:fade .3s
}

@keyframes fade{
  from{opacity:0}
}

.sheet{
  width:min(860px,100%);
  max-height:92vh;
  overflow:auto;
  background:#f6f2ea;
  color:#26272b;
  border-radius:18px;
  box-shadow:0 40px 90px -20px rgba(0,0,0,.8);
  animation:pop .4s var(--ease)
}

@keyframes pop{
  from{
    transform:translateY(24px) scale(.97);
    opacity:0
  }
}

.sheet-bar{
  position:sticky;
  top:0;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  padding:14px 22px;
  background:var(--maroon);
  color:var(--text)
}

.sheet-bar .b{
  display:flex;
  gap:10px
}

.sheet-bar .btn.ghost{
  color:var(--text)
}

.cv{
  display:grid;
  grid-template-columns:.36fr .64fr
}

.cv aside{
  background:#dcd8cf;
  padding:30px 24px
}

.cv main{
  padding:30px 32px
}

.cv h4{
  font-family:var(--display);
  font-size:1.5rem;
  line-height:1.15;
  margin-bottom:6px;
  color:#1e2024
}

.cv h5{
  font:700 .82rem var(--body);
  letter-spacing:.06em;
  color:var(--maroon);
  border-bottom:2px solid var(--rose);
  padding-bottom:5px;
  margin:22px 0 10px
}

.cv .role2{
  font-weight:600;
  color:var(--rose);
  margin-bottom:6px
}

.cv p,.cv li{
  font-size:.86rem;
  line-height:1.55
}

.cv ul{
  list-style:none;
  display:grid;
  gap:5px
}

.cv aside li{
  padding-left:12px;
  position:relative
}

.cv aside li::before{
  content:"";
  position:absolute;
  left:0;
  top:.6em;
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--rose)
}

.cv .job{
  margin-bottom:14px
}

.cv .job b{

}

.cv .job em{

}

.cv .job ul{

/* ---------- Toast & reveal ---------- */

.toast{
  position:fixed;
  left:50%;
  bottom:28px;
  translate:-50% 30px;
  background:var(--sage);
  color:var(--charcoal);
  font-weight:700;
  padding:12px 22px;
  border-radius:14px;
  opacity:0;
  pointer-events:none;
  transition:all .4s var(--ease);
  z-index:200
}

.toast.show{
  opacity:1;
  translate:-50% 0
}

.rv{
  opacity:0;
  transform:translateY(26px);
  transition:opacity .8s var(--ease),transform .8s var(--ease)
}

.rv.in{
  opacity:1;
  transform:none
}

.swap{
  animation:swap .45s var(--ease)
}

@keyframes swap{
  from{
    opacity:.2;
    transform:translateY(6px)
  }
}

/* ---- Language switch ---- */
function setLanguage(next){
  if(next !== 'en' && next !== 'fr') return;

  lang = next;

  try{
    localStorage.setItem('lang', lang);
  }catch(_){ }

  // Update all translated/static content first.
  renderStatic();
  renderSkills();
  renderFilters();
  renderProjects();

  const expList = $('#expList');
  const eduList = $('#eduList');

  if(expList) expList.innerHTML = timeline(EXP);
  if(eduList) eduList.innerHTML = timeline(EDU);

  renderResume();

  const langBox = $('#lang');
  if(langBox) langBox.dataset.lang = lang;

  $$('#lang button[data-set]').forEach(btn=>{
    btn.setAttribute('aria-pressed', btn.dataset.set === lang ? 'true' : 'false');
  });

  document.documentElement.lang = lang;

  try{
    typing.restart();
  }catch(_){ }
}

/* ---- Typed role ---- */

const typing = (()=>{
  
  let i=0,
      j=0,
      del=false,
      timer;

  const el =
    $('#typed');

  function tick(){

    const w =
      ROLES[lang][i];

    if(reduce){

      el.textContent = w;

      return;

    }

    el.textContent =
      w.slice(0,j);

    let d =
      del ? 35 : 75;

    if(
      !del &&
      j===w.length
    ){

      del=true;
      d=1500;

    }

    else if(
      del &&
      j===0
    ){

      del=false;
      i=
        (i+1) %
        ROLES[lang].length;

      d=350;

    }

    else{

      j +=
        del ? -1 : 1;

    }

    timer =
      setTimeout(
        tick,
        d
      );

  }

  return {

    restart(){

      clearTimeout(timer);

      i=0;
      j=0;
      del=false;

      tick();

    }

  };

})();

        );

    })();

  }

  line();

/* ---- Network canvas ---- */

(function(){

  const c =
    $('#net');

  const x =
    c.getContext('2d');

  let W,
      H,
      pts=[],
      packets=[],
      mx=-999,
      my=-999,
      run=true;

  const cols = [
    '161,168,118',
    '184,159,114',
    '176,104,104'
  ];

  const LINK=150;

  function size(){

    const d =
      Math.min(
        devicePixelRatio||1,
        2
      );

    W=innerWidth;
    H=innerHeight;

    c.width=W*d;
    c.height=H*d;

    x.setTransform(
      d,0,0,d,0,0
    );

    const n =
      Math.round(
        Math.min(
          85,
          W*H/17000
        )
      );

    pts =
      Array.from(
        {length:n},
        ()=>({

          x:Math.random()*W,

          y:Math.random()*H,

          vx:(Math.random()-.5)*.4,

          vy:(Math.random()-.5)*.4,

          r:1.4+Math.random()*1.8,

          ph:Math.random()*6.28,

          c:
            cols[
              Math.floor(
                Math.random()*3
              )
            ]

        })
      );

    packets=[];

  }

  function frame(t){

    x.clearRect(
      0,0,W,H
    );

    for(const p of pts){

      if(!reduce){

        p.x+=p.vx;

        p.y+=p.vy;

        if(p.x<-20)
          p.x=W+20;

        if(p.x>W+20)
          p.x=-20;

        if(p.y<-20)
          p.y=H+20;

        if(p.y>H+20)
          p.y=-20;

        const dx=
          p.x-mx;

        const dy=
          p.y-my;

        const dm=
          Math.hypot(
            dx,
            dy
          );

        if(
          dm<120 &&
          dm>0
        ){

          p.x +=
            dx/dm*.9;

          p.y +=
            dy/dm*.9;

        }

      }

    }

    for(
      let a=0;
      a<pts.length;
      a++
    ){

      const A=pts[a];

      for(
        let b=a+1;
        b<pts.length;
        b++
      ){

        const B=pts[b];

        const d=
          Math.hypot(
            A.x-B.x,
            A.y-B.y
          );

        if(d<LINK){

          x.strokeStyle=
            `rgba(${A.c},${(1-d/LINK)*.28})`;

          x.lineWidth=1;

          x.beginPath();

          x.moveTo(
            A.x,
            A.y
          );

          x.lineTo(
            B.x,
            B.y
          );

          x.stroke();

        }

      }

      const dm =
        Math.hypot(
          A.x-mx,
          A.y-my
        );

      if(dm<170){

        x.strokeStyle=
          `rgba(184,159,114,${(1-dm/170)*.6})`;

        x.lineWidth=1.2;

        x.beginPath();

        x.moveTo(
          A.x,
          A.y
        );

        x.lineTo(
          mx,
          my
        );

        x.stroke();

      }

    }

    for(const p of pts){

      const pulse =
        reduce
          ? 1
          : 1+
            Math.sin(
              t/900+p.ph
            )*.35;

      x.fillStyle=
        `rgba(${p.c},.12)`;

      x.beginPath();

      x.arc(
        p.x,
        p.y,
        p.r*4*pulse,
        0,
        7
      );

      x.fill();

      x.fillStyle=
        `rgba(${p.c},.95)`;

      x.beginPath();

      x.arc(
        p.x,
        p.y,
        p.r,
        0,
        7
      );

      x.fill();

    }

    if(!reduce){

      if(
        packets.length<16 &&
        Math.random()<.05
      ){

        const a =
          pts[
            Math.floor(
              Math.random()*
              pts.length
            )
          ];

        const near =
          pts.filter(
            b=>
              b!==a &&
              Math.hypot(
                a.x-b.x,
                a.y-b.y
              )<LINK
          );

        if(near.length)

          packets.push({

            a,

            b:
              near[
                Math.floor(
                  Math.random()*
                  near.length
                )
              ],

            t:0,

            s:
              .012+
              Math.random()*.012

          });

      }

      packets =
        packets.filter(k=>{

          k.t+=k.s;

          if(k.t>=1)
            return false;

          const px =
            k.a.x+
            (k.b.x-k.a.x)*
            k.t;

          const py =
            k.a.y+
            (k.b.y-k.a.y)*
            k.t;

          x.fillStyle=
            'rgba(161,168,118,.25)';

          x.beginPath();

          x.arc(
            px,
            py,
            8,
            0,
            7
          );

          x.fill();

          x.fillStyle=
            'rgba(236,240,210,.95)';

          x.beginPath();

          x.arc(
            px,
            py,
            2.2,
            0,
            7
          );

          x.fill();

          return true;

        });

      if(run)

        requestAnimationFrame(
          frame
        );

    }

  }

  size();

  requestAnimationFrame(
    frame
  );

  addEventListener(
    'resize',
    ()=>{
      size();

      if(reduce)
        requestAnimationFrame(frame);

    }
  );

  addEventListener(
    'pointermove',
    e=>{
      mx=e.clientX;
      my=e.clientY;
    },
    {passive:true}
  );

  addEventListener(
    'pointerleave',
    ()=>{
      mx=my=-999;
    }
  );

  document.addEventListener(
    'visibilitychange',
    ()=>{

      const was=run;

      run=!document.hidden;

      if(
        run &&
        !was &&
        !reduce
      )
        requestAnimationFrame(frame);

    }
  );

})();

    {threshold:.15}
  );


$$('.rv').forEach(
  el=>io.observe(el)
);


/* ---- Active navigation ---- */

const spy =
  new IntersectionObserver(
    es=>es.forEach(e=>{

      if(e.isIntersecting)

        $$('.links a')
          .forEach(
            a=>
              a.classList.toggle(
                'active',
                a.getAttribute('href')===
                '#'+e.target.id
              )
          );

    }),
    {
      rootMargin:
        '-45% 0px -50% 0px'
    }
  );


$$('main section').forEach(
  s=>spy.observe(s)
);


addEventListener(
  'scroll',
  ()=>
    $('header')
      .classList.toggle(
        'solid',
        scrollY>30
      ),
  {passive:true}
);


/* ---- Mobile menu ---- */

const burger =
  $('#burger');

const links =
  $('#links');

burger.addEventListener(
  'click',
  ()=>{

    const o =
      links.classList.toggle(
        'open'
      );

    burger.setAttribute(
      'aria-expanded',
      o
    );

  }
);


links.addEventListener(
  'click',
  e=>{

    if(
      e.target.closest('a')
    ){

      links.classList.remove(
        'open'
      );

      burger.setAttribute(
        'aria-expanded',
        false
      );

    }

  }
);


/* ---- Button ripple ---- */

document.addEventListener(
  'pointerdown',
  e=>{

    const b =
      e.target.closest('.btn');

    if(!b||reduce)
      return;

    const r =
      b.getBoundingClientRect();

    const s =
      Math.max(
        r.width,
        r.height
      );

    const sp =
      document.createElement(
        'span'
      );

    sp.className='ripple';

    sp.style.cssText=
      `width:${s}px;
       height:${s}px;
       left:${e.clientX-r.left-s/2}px;
       top:${e.clientY-r.top-s/2}px`;

    b.appendChild(sp);

    setTimeout(
      ()=>sp.remove(),
      650
    );

  }
);


/* ---- Toast ---- */

const toast =
  $('#toast');

let tt;


function say(m){

  toast.textContent=m;

  toast.classList.add(
    'show'
  );

  clearTimeout(tt);

  tt=
    setTimeout(
      ()=>toast.classList.remove('show'),
      2200
    );

}


$('#copyMail').addEventListener(
  'click',
  async()=>{

    try{

      await navigator.clipboard.writeText(
        'nandinikrishnavv@gmail.com'
      );

      say(
        UI[lang].copied
      );

    }

    catch(_){

      location.href=
        'mailto:nandinikrishnavv@gmail.com';

    }

  }
);


$('#mailForm').addEventListener(
  'submit',
  e=>{

    e.preventDefault();

    const n =
      $('#fName').value;

    const m =
      $('#fMail').value;

    const msg =
      $('#fMsg').value;

    const subj =
      lang==='fr'
        ? `Message de ${n} depuis votre portfolio`
        : `Message from ${n} via your portfolio`;

    location.href =
      `mailto:nandinikrishnavv@gmail.com?subject=${
        encodeURIComponent(subj)
      }&body=${
        encodeURIComponent(
          msg+'\n\n'+n+'\n'+m
        )
      }`;

  }
);


/* ---- Resume modal ---- */

const modal =
  $('#resumeModal');


function openCv(){

  modal.classList.add(
    'open'
  );

  document.body.style.overflow=
    'hidden';

  $('#closeCv').focus();

}


function closeCv(){

  modal.classList.remove(
    'open'
  );

  document.body.style.overflow='';

  $('#openCv').focus();

}


$('#openCv').addEventListener(
  'click',
  openCv
);


$('#closeCv').addEventListener(
  'click',
  closeCv
);


modal.addEventListener(
  'click',
  e=>{

    if(e.target===modal)
      closeCv();

  }
);


addEventListener(
  'keydown',
  e=>{

    if(
      e.key==='Escape' &&
      modal.classList.contains('open')
    )
      closeCv();

  }
);


$('#printCv').addEventListener(
  'click',
  ()=>{

    document.body.classList.add(
      'printing'
    );

    print();

  }
);


addEventListener(
  'afterprint',
  ()=>document.body.classList.remove(
    'printing'
  )
);


renderAll(false);

</script>

</body>
</html>
