<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nandini Clochard Vadla | Cybersecurity • Data Science • AI</title>
<meta name="description" content="Nandini Clochard Vadla, MSc Cybersecurity & Data Science student at ESAIP Angers. Projects in digital forensics, DevSecOps, cloud security, big data and machine learning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --charcoal:#0e0f12;
  --charcoal-2:#15171a;
  --maroon:#2a1212;
  --rose:#7a4a4a;
  --sage:#a1a876;
  --tan:#b89f72;
  --text:#efe9df;
  --muted:#aaa59b;
  --line:rgba(239,233,223,.1);
  --card:rgba(38,17,17,.45);
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}

*{box-sizing:border-box;margin:0;padding:0}

html{
  scroll-behavior:smooth;
  scroll-padding-top:84px
}

body{
  font-family:var(--body);
  color:var(--text);
  background:var(--charcoal);
  line-height:1.65;
  overflow-x:hidden
}

a{color:inherit;text-decoration:none}
img,svg{max-width:100%}

:focus-visible{
  outline:2px solid var(--sage);
  outline-offset:3px;
  border-radius:6px
}

.wrap{
  width:min(1120px,100% - 40px);
  margin-inline:auto
}

section{padding:96px 0}

.section-head{
  margin-bottom:8px;
}

.section-head .eyebrow{
  color:var(--tan);
  font-size:.78rem;
  font-weight:700;
  letter-spacing:.14em;
  margin-bottom:8px;
}

.section-head > p:last-child{
  color:var(--muted);
  max-width:60ch;
}

h1,h2,h3{
  font-family:var(--display);
  font-weight:600;
  line-height:1.15;
  letter-spacing:-.01em
}

h2{
  font-size:clamp(2rem,4vw,2.9rem);
  margin-bottom:12px
}

.lead{
  color:var(--muted);
  max-width:60ch;
  margin-bottom:44px
}

/* ---------- Header ---------- */

header{
  position:fixed;
  inset:0 0 auto 0;
  z-index:50;
  transition:background .3s,box-shadow .3s
}

header.solid{
  background:rgba(14,15,18,.82);
  backdrop-filter:blur(14px);
  box-shadow:0 1px 0 var(--line)
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:72px;
  gap:16px
}

.brand{
  font-family:var(--display);
  font-size:1.25rem;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px
}

.brand i{
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--sage);
  box-shadow:0 0 0 0 rgba(161,168,118,.6);
  animation:pulse 2.6s infinite
}

@keyframes pulse{
  70%{box-shadow:0 0 0 12px rgba(161,168,118,0)}
  100%{box-shadow:0 0 0 0 rgba(161,168,118,0)}
}

.links{
  display:flex;
  gap:26px;
  list-style:none;
  font-size:.95rem;
  font-weight:500
}

.links a{
  color:var(--muted);
  position:relative;
  padding:6px 0;
  transition:color .2s
}

.links a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  height:2px;
  width:100%;
  background:var(--tan);
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .3s var(--ease)
}

.links a:hover,
.links a.active{
  color:var(--text)
}

.links a:hover::after,
.links a.active::after{
  transform:scaleX(1)
}

.tools{
  display:flex;
  align-items:center;
  gap:12px
}

.lang{
  position:relative;
  display:flex;
  border:1px solid var(--line);
  border-radius:999px;
  padding:3px;
  background:rgba(0,0,0,.2)
}

.lang button{
  position:relative;
  z-index:1;
  border:0;
  background:none;
  color:var(--muted);
  font:600 .8rem var(--body);
  padding:6px 14px;
  border-radius:999px;
  cursor:pointer;
  transition:color .25s
}

.lang button[aria-pressed="true"]{
  color:var(--charcoal)
}

.lang .thumb{
  position:absolute;
  top:3px;
  left:3px;
  height:calc(100% - 6px);
  width:calc(50% - 3px);
  background:var(--sage);
  border-radius:999px;
  transition:transform .35s var(--ease)
}

.lang[data-lang="fr"] .thumb{
  transform:translateX(100%)
}

.burger{
  display:none;
  width:42px;
  height:42px;
  border-radius:12px;
  border:1px solid var(--line);
  background:none;
  color:var(--text);
  cursor:pointer
}

.burger span{
  display:block;
  width:18px;
  height:2px;
  background:currentColor;
  margin:4px auto;
  transition:transform .3s,opacity .3s
}

.burger[aria-expanded="true"] span:nth-child(1){
  transform:translateY(6px) rotate(45deg)
}

.burger[aria-expanded="true"] span:nth-child(2){
  opacity:0
}

.burger[aria-expanded="true"] span:nth-child(3){
  transform:translateY(-6px) rotate(-45deg)
}

/* ---------- Buttons ---------- */

.btn{
  position:relative;
  overflow:hidden;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  border:1px solid transparent;
  cursor:pointer;
  font:700 .95rem var(--body);
  padding:14px 26px;
  border-radius:14px;
  transition:transform .2s var(--ease),box-shadow .3s,background .3s,border-color .3s,color .3s;
  -webkit-tap-highlight-color:transparent
}

.btn svg{
  width:18px;
  height:18px;
  flex:none;
  transition:transform .3s var(--ease)
}

.btn:hover svg{
  transform:translateX(3px)
}

.btn:active{
  transform:scale(.96)
}

.btn.primary{
  background:linear-gradient(135deg,var(--sage),var(--tan));
  color:var(--charcoal);
  box-shadow:0 10px 30px -10px rgba(161,168,118,.6)
}

.btn.primary:hover{
  box-shadow:0 16px 36px -10px rgba(184,159,114,.75);
  transform:translateY(-2px)
}

/* Special animated effect for the main View my projects button */
#hero .btn.primary{
  animation:projectGlow 2.8s ease-in-out infinite;
}

#hero .btn.primary:hover{
  animation-play-state:paused;
}

@keyframes projectGlow{
  0%,100%{
    box-shadow:0 10px 30px -10px rgba(161,168,118,.55);
  }
  50%{
    box-shadow:0 14px 42px -8px rgba(184,159,114,.9),0 0 0 5px rgba(161,168,118,.08);
  }
}

.btn.primary::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);
  transform:translateX(-120%);
  transition:transform .7s var(--ease)
}

.btn.primary:hover::before{
  transform:translateX(120%)
}

.btn.ghost{
  background:rgba(239,233,223,.04);
  border-color:var(--line);
  color:var(--text)
}

.btn.ghost:hover{
  border-color:var(--tan);
  background:rgba(184,159,114,.1);
  transform:translateY(-2px)
}

.btn.small{
  padding:10px 18px;
  font-size:.85rem;
  border-radius:12px
}

.ripple{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.4);
  transform:scale(0);
  animation:rip .6s ease-out forwards;
  pointer-events:none
}

@keyframes rip{
  to{
    transform:scale(4);
    opacity:0
  }
}

/* ---------- Hero ---------- */

#hero{
  min-height:100svh;
  display:flex;
  align-items:center;
  padding:120px 0 72px;
  position:relative
}

#net{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:-1;
  pointer-events:none
}

.aurora{
  position:fixed;
  inset:0;
  z-index:-2;
  overflow:hidden;
  pointer-events:none
}

.aurora i{
  position:absolute;
  border-radius:50%;
  filter:blur(100px);
  animation:drift 24s ease-in-out infinite alternate
}

.aurora i:nth-child(1){
  width:560px;
  height:560px;
  background:var(--rose);
  opacity:.3;
  top:-160px;
  right:-100px
}

.aurora i:nth-child(2){
  width:460px;
  height:460px;
  background:var(--sage);
  opacity:.12;
  bottom:-140px;
  left:4%;
  animation-duration:30s;
  animation-delay:-9s
}

.aurora i:nth-child(3){
  width:640px;
  height:640px;
  background:#3b1616;
  opacity:.55;
  top:38%;
  left:42%;
  animation-duration:36s;
  animation-delay:-16s
}

@keyframes drift{
  to{
    transform:translate3d(-110px,80px,0) scale(1.18)
  }
}

.hero-grid{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:56px;
  align-items:center
}

.hello{
  color:var(--tan);
  font-weight:600;
  margin-bottom:14px
}

h1{
  font-size:clamp(2.8rem,7vw,5.4rem);
  letter-spacing:-.025em;
  margin-bottom:18px
}

.role{
  font-family:var(--display);
  font-size:clamp(1.3rem,2.6vw,1.9rem);
  color:var(--sage);
  min-height:2.4em
}

.caret{
  display:inline-block;
  width:2px;
  height:1em;
  background:var(--tan);
  vertical-align:-.12em;
  margin-left:3px;
  animation:blink 1s steps(1) infinite
}

@keyframes blink{
  50%{opacity:0}
}

.hero p.sub{
  color:var(--muted);
  max-width:52ch;
  margin:10px 0 32px;
  font-size:1.05rem
}

.cta{
  display:flex;
  flex-wrap:wrap;
  gap:14px
}

.term{
  background:rgba(8,8,10,.88);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 30px 60px -25px rgba(0,0,0,.7),0 0 0 1px rgba(119,72,72,.25);
  overflow:hidden;
  transform:rotate(1.2deg);
  transition:transform .5s var(--ease)
}

.term:hover{
  transform:rotate(0)
}

.term-bar{
  display:flex;
  gap:7px;
  padding:13px 16px;
  border-bottom:1px solid var(--line);
  background:rgba(42,18,18,.7)
}

.term-bar i{
  width:11px;
  height:11px;
  border-radius:50%
}

.term-bar i:nth-child(1){background:var(--rose)}
.term-bar i:nth-child(2){background:var(--tan)}
.term-bar i:nth-child(3){background:var(--sage)}

.term-body{
  font:400 .82rem/1.9 var(--mono);
  padding:20px;
  min-height:230px;
  color:#cfc9be;
  white-space:pre-wrap;
  word-break:break-word
}

.term-body .ok{color:var(--sage)}
.term-body .warn{color:#d59a8f}
.term-body .cmd{color:var(--tan)}

.scroll-hint{
  position:absolute;
  bottom:26px;
  left:50%;
  translate:-50% 0;
  z-index:1;
  width:26px;
  height:42px;
  border:2px solid var(--line);
  border-radius:14px
}

.scroll-hint::after{
  content:"";
  position:absolute;
  left:50%;
  top:8px;
  width:4px;
  height:8px;
  border-radius:4px;
  background:var(--tan);
  translate:-50% 0;
  animation:wheel 1.8s infinite
}

@keyframes wheel{
  0%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(14px)}
}

/* ---------- About ---------- */

.about-grid{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:48px
}

.about-grid p{
  color:#d8d2c7;
  margin-bottom:16px;
  max-width:62ch
}

.facts{
  list-style:none;
  display:grid;
  gap:12px;
  margin-top:24px
}

.facts li{
  display:flex;
  gap:12px;
  align-items:center;
  color:var(--muted)
}

.facts svg{
  width:20px;
  height:20px;
  color:var(--tan);
  flex:none
}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:28px
}

.panel h3{
  font-size:1.25rem;
  margin-bottom:20px
}

.lg{
  margin-bottom:18px
}

.lg div{
  display:flex;
  justify-content:space-between;
  font-size:.92rem;
  margin-bottom:7px
}

.lg span:last-child{
  color:var(--tan);
  font-weight:600
}

.bar{
  height:8px;
  border-radius:8px;
  background:rgba(239,233,223,.09);
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  width:0;
  border-radius:8px;
  background:linear-gradient(90deg,var(--rose),var(--tan),var(--sage));
  transition:width 1.4s var(--ease)
}

/* ---------- Skills ---------- */

.skills{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px
}

.skill{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:24px;
  transition:border-color .3s,transform .3s var(--ease)
}

.skill:hover{
  border-color:rgba(161,168,118,.55);
  transform:translateY(-4px)
}

.skill h3{
  font-size:1.1rem;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:10px
}

.skill h3 svg{
  width:22px;
  height:22px;
  color:var(--sage)
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.chip{
  font-size:.8rem;
  font-weight:500;
  padding:5px 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(10,10,12,.7);
  color:#ddd6c9;
  transition:background .25s,color .25s,border-color .25s
}

.chip:hover{
  background:var(--sage);
  color:var(--charcoal);
  border-color:var(--sage)
}

/* ---------- Projects ---------- */

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:32px
}

.filters button{
  font:600 .88rem var(--body);
  padding:9px 20px;
  border-radius:999px;
  border:1px solid var(--line);
  background:none;
  color:var(--muted);
  cursor:pointer;
  transition:all .25s
}

.filters button:hover{
  color:var(--text);
  border-color:var(--tan)
}

.filters button[aria-pressed="true"]{
  background:var(--rose);
  border-color:var(--rose);
  color:#fff
}

.projects{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:22px
}

.proj{
  position:relative;
  display:flex;
  flex-direction:column;
  background:linear-gradient(160deg,rgba(42,18,18,.6),rgba(16,17,20,.85));
  border:1px solid var(--line);
  border-radius:20px;
  padding:26px;
  overflow:hidden;
  transition:transform .35s var(--ease),border-color .3s,box-shadow .35s
}

.proj::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  height:3px;
  width:100%;
  background:linear-gradient(90deg,var(--sage),var(--tan),var(--rose));
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .5s var(--ease)
}

.proj:hover{
  transform:translateY(-6px);
  border-color:rgba(184,159,114,.5);
  box-shadow:0 24px 50px -24px rgba(0,0,0,.8)
}

.proj:hover::before{
  transform:scaleX(1)
}

.proj.hide{
  display:none
}

.proj .type{
  font-size:.78rem;
  color:var(--tan);
  font-weight:600;
  margin-bottom:10px
}

.proj h3{
  font-size:1.3rem;
  margin-bottom:10px
}

.proj p{
  color:#cfc9be;
  font-size:.95rem;
  margin-bottom:18px;
  flex:1
}
